<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DISHA — Field Operations Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .field-main {
      display: flex;
      height: calc(100vh - 60px);
      background: var(--bg);
    }
    .panel-left, .panel-right {
      width: 350px;
      background: rgba(13, 26, 33, 0.95);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .panel-right {
      border-right: none;
      border-left: 1px solid var(--border);
    }
    .panel-center {
      flex: 1;
      position: relative;
    }
    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    
    /* Team Cards */
    .team-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .team-card.available { border-left: 3px solid var(--green); }
    .team-card.dispatched { border-left: 3px solid var(--orange); }
    .team-card.on_scene { border-left: 3px solid var(--red); }
    
    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .team-id {
      font-weight: bold;
      font-size: 16px;
    }
    .team-status {
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-available { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .status-dispatched { background: rgba(249, 115, 22, 0.2); color: var(--orange); }
    .status-on_scene { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    
    .team-actions {
      margin-top: 10px;
    }
    .team-actions select, .team-actions button {
      width: 100%;
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      color: white;
      border-radius: 4px;
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
    }
    .team-actions button {
      background: var(--accent);
      cursor: pointer;
      font-weight: bold;
    }
    .team-actions button:hover {
      background: #00b3cc;
    }

    /* Report Feed */
    .report-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .report-time {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .report-title {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .report-stat {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      color: var(--red);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="pulse-status"></div>
      DISHA 
      <span class="flow-title">Field Operations Command</span>
    </div>
    <div class="header-actions" style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 10px; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);" title="Data provided by various sources">
        DATA: NASA SRTM · CHIRPS · IMD Open-Meteo · HydroRIVERS · ESA WorldCover
      </span>
      <button class="btn" style="padding: 6px 12px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;" onclick="window.location.href='index.html'">🔙 Back to Main EWS</button>
      <span>🕐 <span id="last-sync">Just now</span></span>
    </div>
  </header>

  <div class="field-main">
    
    <!-- LEFT PANEL: Teams & Dispatch -->
    <div class="panel-left">
      <div class="panel-header">
        Incident Response Teams
        <span id="teams-count" style="background:var(--accent); color:white; padding:2px 6px; border-radius:10px; font-size:11px;">0</span>
      </div>
      <div class="panel-content" id="teams-list">
        <div style="text-align:center; color:var(--text-dim); margin-top:20px;">Loading teams...</div>
      </div>
    </div>

    <!-- CENTER PANEL: Map -->
    <div class="panel-center">
      <div id="map"></div>
    </div>

    <!-- RIGHT PANEL: Live Reports -->
    <div class="panel-right">
      <div class="panel-header">
        Live Field Reports
        <button onclick="fetchReports()" style="background:none; border:none; color:var(--text-dim); cursor:pointer;">🔄</button>
      </div>
      <div class="panel-content" id="reports-list">
        <div style="text-align:center; color:var(--text-dim); margin-top:20px;">Waiting for field updates...</div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/field_ops.js?v=4"></script>
</body>
</html>
